[plugin]

name="Terrain Brush"
description="Paint terrain tile types directly in the 3D viewport. Toggle 'Terrain Brush' in the spatial toolbar, pick a tile type and radius, then click-drag over a Map's terrain to paint cells into terrain_data.tile_types (Open/Water/Forest/Cliff/NoGo). Live mesh + tri-state overlay update, undoable."
author="Dissent Horizon"
version="1.0"
script="terrain_brush_plugin.gd"
