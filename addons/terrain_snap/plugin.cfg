[plugin]

name="Terrain Snap"
description="Hold Option (Alt) as you release a transform drag in the 3D viewport to snap the selected Node3D(s) to the terrain heightmap height; hold Option+Shift to snap to the terrain grid cell. Opt-in, modifier-gated, undoable."
author="Dissent Horizon"
version="1.0"
script="terrain_snap_plugin.gd"
