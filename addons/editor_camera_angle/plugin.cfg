[plugin]

name="Editor Camera Angle"
description="Adds a 'Cam Angle' button to the 3D editor toolbar. Pressing it snaps the editor camera to RTSCamera3D.initial_position() (derived from CAMERA_ANGLE_DEGREES + INITIAL_DISTANCE) and looks at the scene origin, reproducing the player's game view so flat sprites are composed as the player will see them. One-shot; the camera is free to navigate afterward."
author="Dissent Horizon"
version="1.0"
script="editor_camera_angle.gd"
