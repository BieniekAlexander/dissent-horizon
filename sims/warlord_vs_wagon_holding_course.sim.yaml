description: |
  A War Wagon (STEADY, unarmed) sweeping across the Warlord's front on long legs. Slow targets
  are run down whatever they do, and this one is not even trying: the claim is that it dies.
  
  Speeds and the Warlord rocket: gdd/movement/speed_classes.md and
  gdd/systems/combat/projectiles.md §Rocket calibration (The Warlord: predict, then chase).
setting: { kind: flat, size: 30 }
given:
  A:
    with:
      warlord:
        of: [ { piece: an_bioMedium_dominionGen, count: 1 } ]
        at: west
        facing: east
        orders: [ { attack: { target: B.target } } ]
  B:
    with:
      target:
        of: [ { piece: an_mechStrong_transport, count: 1 } ]
        at: { from: A.warlord, distance: 8, bearing: east }
        facing: north
        orders:
          - { move: { target: { from: B.target, distance: 5, bearing: north } } }
          - { move: { target: { from: B.target, distance: 5, bearing: south } } }
          - { move: { target: { from: B.target, distance: 5, bearing: north } } }
          - { move: { target: { from: B.target, distance: 5, bearing: south } } }
          - { move: { target: { from: B.target, distance: 5, bearing: north } } }
          - { move: { target: { from: B.target, distance: 5, bearing: south } } }
          - { move: { target: { from: B.target, distance: 5, bearing: north } } }
          - { move: { target: { from: B.target, distance: 5, bearing: south } } }
run: { for: 15s }
expect:
  - { of: B.target, check: dead }
  - { of: B.target, check: hp_fraction, at_most: 0.99, by: 15s }
