description: |
  A Raven (SWIFT hovering transport, unarmed) sweeping across the Warlord's front on 20-unit
  legs, inside its air reach. The Warlord keeps its anti-air role through the lead stage: an
  aircraft that holds its course is hit.
  
  Speeds and the Warlord rocket: gdd/movement/speed_classes.md and
  gdd/systems/combat/projectiles.md §Rocket calibration (The Warlord: predict, then chase).

  Claim: at least 3 rockets in 4 hit.
  The claim is about the WEAPON, as a fraction of the rockets fired that hit — never about
  killing, which is the shooter's damage rate and out of scope for a projectile.
setting: { kind: flat, size: 30 }
given:
  A:
    with:
      warlord:
        of: [ { piece: an_bioMedium_dominionGen, count: 1 } ]
        at: west
        facing: east
        orders: [ { attack: { target: B.target } } ]
  B:
    with:
      target:
        of: [ { piece: an_aircraftLight_transport, count: 1 } ]
        at: { from: A.warlord, distance: 6, bearing: east }
        facing: north
        orders:
          - { move: { target: { from: B.target, distance: 10, bearing: north } } }
          - { move: { target: { from: B.target, distance: 10, bearing: south } } }
          - { move: { target: { from: B.target, distance: 10, bearing: north } } }
          - { move: { target: { from: B.target, distance: 10, bearing: south } } }
          - { move: { target: { from: B.target, distance: 10, bearing: north } } }
          - { move: { target: { from: B.target, distance: 10, bearing: south } } }
          - { move: { target: { from: B.target, distance: 10, bearing: north } } }
          - { move: { target: { from: B.target, distance: 10, bearing: south } } }
          - { move: { target: { from: B.target, distance: 10, bearing: north } } }
          - { move: { target: { from: B.target, distance: 10, bearing: south } } }
run: { for: 15s }
expect:
  - { of: A.warlord, check: hit_rate, target: B.target, at_least: 0.75 }
