description: |
  THE AGGRESSION DIAL COMMITS AN ARMY THAT IS AHEAD SOONER. The control is
  commitment/behind_side_waits: A's 8 recruits against B's 6 read 800 / max(600, 680) = 1.18
  under the humility prior, under attack_value_ratio 1.3, so A waits about 6 s on the
  stalemate clock (not by 4 s, by 10 s). With the aggression dial reading the army lead at
  gain 0.5, A's lead of (800 − 680) / 1480 = 0.08 puts the dial at 0.54 and divides A's commit
  ratio by 2^0.08 = 1.06, to 1.23: the clock has 0.05 to relax instead of 0.12, and A
  commits inside 4 s. B's lead turns negative once it has seen A (its dial falls under
  neutral after the hold), and at 0.75 it is under the floor the clock relaxes to either way,
  so B never attacks. Nothing is believed on a bot's FIRST think — the blackboard has not run
  — so a larger gain would read the prior's own optimism (nothing seen is "slightly ahead",
  by 1 − parity) and commit both bots blind; 0.5 is chosen to stay under 1.18 there.
  Axis: POSTURE (aggression). The gain is set rather than left at the tier's 0, which plays
  the control exactly. Rule: gdd/systems/ai/objective-selection.md §The mapping.
setting: { kind: flat, size: 80 }
given:
  A:
    settings:
      difficulty: HARD
      vision: full
      config: { scout_unit_budget: 0, aggression_army_gain: 0.5 }
    with:
      home:
        of: [ { piece: cl_support1, count: 1 } ]
        at: west
      army:
        of: [ { piece: cl_bioLight_antiLight, count: 8 } ]
        at: { from: A.home, distance: 6, bearing: east }
        formation: cluster
  B:
    settings:
      difficulty: HARD
      vision: full
      config: { scout_unit_budget: 0, aggression_army_gain: 0.5 }
    with:
      home:
        of: [ { piece: cl_support1, count: 1 } ]
        at: east
      army:
        of: [ { piece: cl_bioLight_antiLight, count: 6 } ]
        at: { from: B.home, distance: 6, bearing: west }
        formation: cluster
run: { for: 60s, seed: 1 }
expect:
  - { slot: A, check: posture, is: ATTACK, by: 4s }
  - not: [ { slot: B, check: posture, is: ATTACK, by: 25s } ]
