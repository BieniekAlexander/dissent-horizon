description: |
  The pair of warlord_vs_wagon_holding_course: the War Wagon reverses 0.4 s after each rocket
  leaves (the Warlord fires on arming and every 1.5 s after). Jinking is
  meant to save only a FAST target — the Warlord's chase stage runs a STEADY one down after it
  has turned.
  
  Speeds and the Warlord rocket: gdd/movement/speed_classes.md and
  gdd/systems/combat/projectiles.md §Rocket calibration (The Warlord: predict, then chase).

  Claim: a slow vehicle's reroute does not save it: at least 3 rockets in 4 hit.
  The claim is about the WEAPON, as a fraction of the rockets fired that hit — never about
  killing, which is the shooter's damage rate and out of scope for a projectile.
setting: { kind: flat, size: 30 }
given:
  A:
    with:
      warlord:
        of: [ { piece: an_bioMedium_dominionGen, count: 1 } ]
        at: west
        facing: east
        orders: [ { attack: { target: B.target } } ]
  B:
    with:
      target:
        of: [ { piece: an_mechStrong_transport, count: 1 } ]
        at: { from: A.warlord, distance: 8, bearing: east }
        facing: north
        orders:
          - { move: { target: { from: B.target, distance: 5, bearing: north } } }
          - { move: { target: { from: B.target, distance: 5, bearing: south } }, after: 0.4s }
          - { move: { target: { from: B.target, distance: 5, bearing: north } }, after: 1.9s }
          - { move: { target: { from: B.target, distance: 5, bearing: south } }, after: 3.4s }
          - { move: { target: { from: B.target, distance: 5, bearing: north } }, after: 4.9s }
          - { move: { target: { from: B.target, distance: 5, bearing: south } }, after: 6.4s }
          - { move: { target: { from: B.target, distance: 5, bearing: north } }, after: 7.9s }
          - { move: { target: { from: B.target, distance: 5, bearing: south } }, after: 9.4s }
          - { move: { target: { from: B.target, distance: 5, bearing: north } }, after: 10.9s }
          - { move: { target: { from: B.target, distance: 5, bearing: south } }, after: 12.4s }
          - { move: { target: { from: B.target, distance: 5, bearing: north } }, after: 13.9s }
run: { for: 15s }
expect:
  - { of: A.warlord, check: hit_rate, target: B.target, at_least: 0.75 }
